# The agency's one shared WhatsApp sender: Meta WhatsApp Cloud API with the
# company's own number. Committed file -- nothing here is secret on its own
# (phone_number_id is useless without the token); the access token lives in
# Supabase Vault:
#   venv/Scripts/python scripts/set_vault_secret.py agency.whatsapp.access_token
#
# Fill in after Meta setup (see docs/notifications.md):
#   phone_number_id  WhatsApp Manager -> API Setup -> "Phone number ID"
#   display_number   the number itself, for display on the Settings page
#   alert_template   approved template, ONE body variable {{1}} (alert text)
#   report_template  approved template, IMAGE header + ONE body variable {{1}} caption
#
# Leave phone_number_id blank to keep WhatsApp disabled -- the pipeline
# skips sending (not an error).

phone_number_id: "1360522473811610"
display_number: ""
access_token_secret: agency.whatsapp.access_token
alert_template: alert_notification
report_template: daily_report_image
template_language: en
