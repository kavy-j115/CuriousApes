# Template for one brand's config. Copy this file into config/clients/ as
# <client_id>.yaml. Lives outside config/clients/ specifically so the
# pipeline orchestrator (which treats every config/clients/*.yaml file as a
# real client to sync) never picks it up by mistake.
#
# Two kinds of values below, handled differently -- see docs/secrets.md:
# - Identifiers (store_domain, ad_account_id) aren't secret. Safe to commit
#   as plain values, right in this file.
# - Credentials (access_token_secret, service_account_secret) are NEVER
#   stored here. Each field names a secret stored in Supabase Vault --
#   create it with: venv/Scripts/python scripts/set_vault_secret.py <name>

client_id: example-brand          # short, stable slug — used as a key in the database
display_name: "Example Brand"

shopify:
  store_domain: example-brand.myshopify.com
  access_token_secret: example-brand.shopify.access_token

meta_ads:
  ad_account_id: ""   # get this once the client shares their ad account with the agency's Business Manager -- no token needed from them at all
  # Shared across every client by default -- see docs/secrets.md "Meta: one
  # shared token". Only give a client their own separate secret name here if
  # you have a specific reason not to use the shared one.
  access_token_secret: agency.meta_ads.access_token

# ga4:
#   property_id: ""   # get this once the client adds our service account's email as a Viewer on their GA4 property -- no token/key from them at all
#   # Shared across every client by default, same as Meta -- see docs/secrets.md.
#   service_account_secret: agency.ga4.service_account_json

thresholds:
  revenue_change_pct: 10
  roas_change_pct: 10
  cac_change_pct: 15
