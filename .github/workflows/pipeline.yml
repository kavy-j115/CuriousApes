name: D2C Analytics Pipeline

on:
  schedule:
    # 03:30 UTC = 09:00 IST -- matches the "run every morning" example from
    # the original project brief.
    - cron: "30 3 * * *"
  workflow_dispatch: {}  # lets us trigger a run manually from the Actions tab, for testing

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install LibreOffice (for Excel formula recalculation)
        run: sudo apt-get update && sudo apt-get install -y libreoffice-calc

      - name: Run pipeline
        # DATABASE_URL is the only secret every per-client credential needs
        # (they live in Supabase Vault instead, reached through this same
        # connection -- see docs/secrets.md). SUPABASE_URL/SERVICE_ROLE_KEY
        # are only needed for Storage upload and DHR WhatsApp sending
        # (docs/notifications.md) -- without them those two steps just log
        # "skipped", same as locally.
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python -m src.scheduler.run_pipeline

      - name: Recalculate Excel formulas
        # openpyxl writes formulas with no cached value -- LibreOffice
        # recalculates on load, and --convert-to (even to the same format)
        # forces a full open/recalc/save round-trip. Recurses into
        # reports/output/dhr/ too, not just the top-level on-demand report.
        run: |
          find reports/output -name "*.xlsx" | while read -r f; do
            soffice --headless --convert-to xlsx --outdir "$(dirname "$f")" "$f"
          done

      - name: Upload generated reports
        uses: actions/upload-artifact@v4
        with:
          name: business-health-reports
          path: reports/output/**/*.xlsx
          retention-days: 30
